[package]
name = "datasync-studio"
version = "0.1.0"
description = "Database schema & data sync tool"
authors = ["daiwei"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "datasync_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# --- database drivers -------------------------------------------------------
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-native-tls",
    "mysql",
    "postgres",
    "chrono",
    "uuid",
    "json",
    "bigdecimal",
] }

# --- spreadsheet import -----------------------------------------------------
# Pure Rust reader for xlsx/xls/ods; keeps the parser out of the webview and
# avoids the unmaintained npm `xlsx` package.
calamine = { version = "0.26", features = ["dates"] }

# --- runtime / core ---------------------------------------------------------
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
futures = "0.3"
thiserror = "2"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
bigdecimal = { version = "0.4", features = ["serde"] }
base64 = "0.22"

# --- secret storage ---------------------------------------------------------
keyring = { version = "3", features = ["apple-native"] }
aes-gcm = "0.10"
rand = "0.8"
hex = "0.4"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
